services:
  # ── Backend (Node.js + Express) ──────────────────────────
  - type: web
    name: techstore-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: techstore-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: https://techstore-web-kd1a.onrender.com

  # ── Frontend (Next.js SSR) ───────────────────────────────
  - type: web
    name: techstore-web
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NEXT_PUBLIC_API_URL
        value: https://techstore-api-9evw.onrender.com/api

databases:
  # ── PostgreSQL (free tier) ───────────────────────────────
  - name: techstore-db
    plan: free
    databaseName: techstore
    user: techstore_user
